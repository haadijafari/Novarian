services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/Django/Dockerfile
    container_name: django_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  db:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      dockerfile: ./dockerfiles/Next/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/bun.lockb # Assuming this should be bun.lockb, correct if it's a typo for bun.lock
          action: rebuild
        - path: ./frontend/next.config.ts
          action: rebuild
        - path: .
          target: ./frontend/src
          action: sync

volumes:
  postgres_db:
